name: Build Tchiskibidi plugins

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Collect plugins
        run: |
          mkdir -p dist
          find build -type d -name "*.vst3" -path "*/Release/VST3/*" -prune -exec cp -R {} dist/ \;
          find build -type d -name "*.component" -path "*/Release/AU/*" -prune -exec cp -R {} dist/ \;
          find build -type d -name "*.app" -path "*/Release/Standalone/*" -prune -exec cp -R {} dist/ \;
          find build -type f -name "*.exe" -path "*/Release/Standalone/*" -exec cp {} dist/ \;
          ls -la dist

      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: |
          for f in dist/*.vst3 dist/*.component dist/*.app; do
            [ -e "$f" ] && codesign --force --deep -s - "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Tchiskibidi-${{ matrix.name }}
          path: dist
