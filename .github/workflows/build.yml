name: Build Tchiskibidi plugins

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      # ---------- macOS: one double-click .pkg installer ----------
      - name: Make macOS installer
        if: runner.os == 'macOS'
        run: |
          set -e
          mkdir -p pkgroot/vst3 pkgroot/au scripts dist
          find build -type d -name "*.vst3" -path "*/Release/VST3/*" -prune -exec cp -R {} pkgroot/vst3/ \;
          find build -type d -name "*.component" -path "*/Release/AU/*" -prune -exec cp -R {} pkgroot/au/ \;
          for f in pkgroot/vst3/* pkgroot/au/*; do codesign --force --deep -s - "$f"; done

          cat > scripts/postinstall <<'EOF'
          #!/bin/bash
          # Remove old manual copies from the user's Library, unblock, refresh AU cache
          U=$(stat -f%Su /dev/console)
          rm -rf "/Users/$U/Library/Audio/Plug-Ins/VST3/Tchiskibidi "* "/Users/$U/Library/Audio/Plug-Ins/Components/Tchiskibidi "*
          # Accords is VST3 only (its MIDI output must reach other tracks in Ableton): remove the old AU
          rm -rf "/Library/Audio/Plug-Ins/Components/Tchiskibidi Accords.component"
          xattr -cr /Library/Audio/Plug-Ins/VST3 /Library/Audio/Plug-Ins/Components 2>/dev/null
          killall -9 AudioComponentRegistrar 2>/dev/null
          exit 0
          EOF
          chmod +x scripts/postinstall

          for kind in vst3 au; do
            pkgbuild --analyze --root pkgroot/$kind $kind.plist
            python3 -c "import plistlib,sys;p=sys.argv[1];d=plistlib.load(open(p,'rb'));[x.__setitem__('BundleIsRelocatable',False) for x in d];plistlib.dump(d,open(p,'wb'))" $kind.plist
          done
          pkgbuild --root pkgroot/vst3 --component-plist vst3.plist --install-location /Library/Audio/Plug-Ins/VST3 \
                   --identifier com.tchiskibidi.vst3 --version 1.0 vst3.pkg
          pkgbuild --root pkgroot/au --component-plist au.plist --install-location /Library/Audio/Plug-Ins/Components \
                   --identifier com.tchiskibidi.au --version 1.0 --scripts scripts au.pkg
          productbuild --package vst3.pkg --package au.pkg dist/Tchiskibidi-Installer-macOS.pkg

      # ---------- Windows: one double-click .exe installer ----------
      - name: Make Windows installer
        if: runner.os == 'Windows'
        run: |
          set -e
          choco install innosetup -y --no-progress
          mkdir -p win/vst3 dist
          find build -type d -name "*.vst3" -path "*/Release/VST3/*" -prune -exec cp -R {} win/vst3/ \;
          cat > installer.iss <<'EOF'
          [Setup]
          AppName=Tchiskibidi Suite
          AppVersion=1.0
          AppPublisher=Tchiskibidi
          DefaultDirName={autopf}\Tchiskibidi
          DisableDirPage=yes
          DisableProgramGroupPage=yes
          Uninstallable=no
          PrivilegesRequired=admin
          ArchitecturesInstallIn64BitMode=x64compatible
          OutputDir=dist
          OutputBaseFilename=Tchiskibidi-Installer-Windows
          [Files]
          Source: "win\vst3\*"; DestDir: "{commoncf64}\VST3"; Flags: ignoreversion recursesubdirs createallsubdirs
          EOF
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: dist

      # ---------- Releases page: the Mac installer is published as soon as it is ready (about 15 min),
      # ---------- the Windows one is added to the same release when its (longer) build is done
      - name: Publish (macOS)
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          sleep 3
          gh release create latest dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Tchiskibidi Suite - derniere version" \
            --notes "Mac : telecharge Tchiskibidi-Installer-macOS.pkg. Windows : telecharge Tchiskibidi-Installer-Windows.exe. Double-clique et suis les etapes."

      - name: Publish (Windows)
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 60); do
            t=$(gh release view latest --repo "$GITHUB_REPOSITORY" --json targetCommitish -q .targetCommitish 2>/dev/null || true)
            [ "$t" = "$GITHUB_SHA" ] && break
            sleep 30
          done
          gh release upload latest dist/* --repo "$GITHUB_REPOSITORY" --clobber
